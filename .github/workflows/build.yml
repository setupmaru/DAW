name: build

on:
  push:
  pull_request:

env:
  JUCE_TAG: 8.0.17-security

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ env.JUCE_TAG }}-${{ runner.os }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # JUCE translation units with LTO need ~1 GB each: unbounded parallelism
        # gets the compiler OOM-killed on the Linux runner.
        run: cmake --build build --config Release --parallel ${{ runner.os == 'Linux' && 2 || 4 }}

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
